services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: chat-rag-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chat_rag_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chat-rag-network

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: chat-rag-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT_API_KEY: qdrant-api-key
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chat-rag-network

  # Ollama LLM
  ollama:
    image: ollama/ollama:latest
    container_name: chat-rag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - chat-rag-network

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chat-rag-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/chat_rag_db
      - SYNC_DATABASE_URL=postgresql://postgres:postgres@postgres:5432/chat_rag_db
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_CHAT_MODEL=qwen3:8b
      - OLLAMA_EMBEDDINGS_PATH=/api/embeddings
      - OLLAMA_EMBEDDING_MODEL=bge-m3
      - OLLAMA_TIMEOUT_SECONDS=600
      - OLLAMA_NUM_CTX=4096
      - OLLAMA_NUM_PREDICT=-1
      - RAG_CONTEXT_DOCS=6
      - RAG_CONTEXT_MAX_CHARS=8000
      - DEBUG=False
      - ENV=production
    volumes:
      - uploads_data:/app/static/uploads
      - paddlex_models:/root/.paddlex
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health/', timeout=5.0).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - chat-rag-network

  # Optional: Redis for caching
  redis:
    image: redis:7-alpine
    container_name: chat-rag-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chat-rag-network

volumes:
  postgres_data:
  qdrant_data:
  ollama_data:
  redis_data:
  uploads_data:
  paddlex_models:

networks:
  chat-rag-network:
    driver: bridge
