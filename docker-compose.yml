services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: chat-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chat_rag_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chat-rag-network

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: chat-rag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT_API_KEY: qdrant-api-key
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chat-rag-network

  # Ollama LLM
  ollama:
    image: ollama/ollama:latest
    container_name: chat-rag-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      # A single chat turn calls TWO models (bge-m3 to embed the query, qwen3 to
      # answer) — with only one slot, every turn paid a full reload of one model
      # to make room for the other, on top of CPU-only generation time (this was
      # the dominant cost behind multi-minute responses, not just slow tokens/sec).
      # 2 slots lets chat+embed stay resident together; ingestion still never
      # needs vision+embed+chat all at once (vision then embedding are sequential
      # phases per the ingest pipeline), so it stays within the same 2-slot cap.
      # Needs host RAM for qwen3:8b (~5-6GB) + bge-m3 (~1.2GB) resident together —
      # fine on 16GB+, revert to 1 on a RAM-constrained host.
      OLLAMA_MAX_LOADED_MODELS: "2"
      # Keep a model warm between the calls of one chat turn (translate -> embed
      # -> generate can span a couple minutes); 30s evicted it mid-turn even
      # when nothing else needed the slot.
      OLLAMA_KEEP_ALIVE: "5m"
      # One request at a time — bounds KV-cache memory (a big image balloons it).
      OLLAMA_NUM_PARALLEL: "1"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - chat-rag-network

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chat-rag-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/chat_rag_db
      - SYNC_DATABASE_URL=postgresql://postgres:postgres@postgres:5432/chat_rag_db
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_CHAT_MODEL=qwen3:8b
      # Use the modern /api/embed endpoint: unlike the legacy /api/embeddings, it
      # honors options.num_ctx (8192) and truncate=true, so a long table chunk is
      # truncated to the window instead of 500'ing "input exceeds context length"
      # and forcing a retry-split. The client already sends the right field
      # ("input" vs "prompt") based on this path.
      - OLLAMA_EMBEDDINGS_PATH=/api/embed
      - OLLAMA_EMBEDDING_MODEL=bge-m3
      - OLLAMA_TIMEOUT_SECONDS=600
      - OLLAMA_NUM_CTX=4096
      # Cap response length so a reasoning model can't run unbounded on CPU and
      # hit the timeout (-1 = unbounded).
      - OLLAMA_NUM_PREDICT=1024
      # Disable qwen3's hidden <think> reasoning for much faster CPU answers.
      - OLLAMA_THINK=false
      # Hardware acceleration: auto (use GPU when present, else CPU), cpu, or cuda.
      # Safe on CPU-only hosts — the default CPU torch build makes "auto" resolve
      # to CPU. GPU passthrough is added by docker-compose.gpu.yml.
      - DEVICE=${DEVICE:-auto}
      - RAG_CONTEXT_DOCS=6
      - RAG_CONTEXT_MAX_CHARS=8000
      # Let Docling OCR pages so TableFormer can recover tables from scanned PDFs
      # (memory-heavy — needs enough RAM; see OCR out-of-memory notes).
      - DOCLING_DO_OCR=true
      # Convert equations to LaTeX (Docling CodeFormula model). Extra model +
      # memory/time at ingest; set false on a RAM-constrained host.
      - DOCLING_FORMULA_ENRICHMENT=true
      # HuggingFace Hub: optional token for higher download rate limits (set
      # HF_TOKEN in .env). HF_HOME points the model cache at a persistent volume
      # so Docling/transformers models download once, not on every recreate.
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HOME=/root/.cache/huggingface
      - DEBUG=False
      - ENV=production
    volumes:
      - uploads_data:/app/static/uploads
      - paddlex_models:/root/.paddlex
      - hf_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health/', timeout=5.0).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - chat-rag-network

  # Optional: Redis for caching
  redis:
    image: redis:7-alpine
    container_name: chat-rag-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chat-rag-network

volumes:
  postgres_data:
  qdrant_data:
  ollama_data:
  redis_data:
  uploads_data:
  paddlex_models:
  hf_cache:

networks:
  chat-rag-network:
    driver: bridge
